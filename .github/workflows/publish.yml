name: Tag & Release

on:
  workflow_dispatch:

jobs:
  release:
    name: Create Release
    runs-on: 2vcpu-ubuntu-2404
    outputs:
      published: ${{ steps.release.outputs.published }}
      version: ${{ steps.release.outputs.version }}

    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6

      - name: Install npm dependencies
        run: yarn install --frozen-lockfile

      - name: Release
        id: release
        env:
          API_TOKEN_GITHUB: ${{ secrets.API_TOKEN_GITHUB }}
          GITHUB_TOKEN: ${{ secrets.API_TOKEN_GITHUB }}
          GITHUB_USER: ${{ github.actor }}
        run: yarn run semantic-release --extends ./release.config.${{ matrix.job.arch }}.js --tag-format='${version}-${{ matrix.job.arch }}'

  build-images:
    name: Build image - ${{ matrix.job.arch }}
    runs-on: ${{ matrix.job.runner }}
    needs: release
    if: needs.release.outputs.published == 'true'

    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Docker Login
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.API_TOKEN_GITHUB }}
      - uses: actions/checkout@v7
      - name: Setup Node.js
        uses: actions/setup-node@v6
      - name: Install npm dependencies
        run: yarn install --frozen-lockfile
      - name: Release
        id: release
        env:
          API_TOKEN_GITHUB: ${{ secrets.API_TOKEN_GITHUB }}
          GITHUB_TOKEN: ${{ secrets.API_TOKEN_GITHUB }}
          GITHUB_USER: ${{ github.actor }}
        run: yarn run semantic-release

  create-manifest:
    name: Create Multi-Arch Manifest
    runs-on: 2vcpu-ubuntu-2404
    needs: [release, build-images]
    if: needs.release.outputs.published == 'true'

    steps:
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.API_TOKEN_GITHUB }}

      - name: Create Manifest
        shell: bash
        if: needs.release.outputs.published == 'true'
        run: |
          echo Published ${{ needs.release.outputs.published }}
          echo Version ${{ needs.release.outputs.version }}

          docker manifest create ghcr.io/greenroom-robotics/ros_builder:lyrical-latest \
            ghcr.io/greenroom-robotics/ros_builder:lyrical-latest-amd64 \
            ghcr.io/greenroom-robotics/ros_builder:lyrical-latest-arm64
          docker manifest create ghcr.io/greenroom-robotics/ros_builder:lyrical-${{ needs.release.outputs.version }} \
            ghcr.io/greenroom-robotics/ros_builder:lyrical-${{ needs.release.outputs.version }}-amd64 \
            ghcr.io/greenroom-robotics/ros_builder:lyrical-${{ needs.release.outputs.version }}-arm64

          # docker manifest create ghcr.io/greenroom-robotics/ros_builder:lyrical-latest-deepstream-8.0 \
          #   ghcr.io/greenroom-robotics/ros_builder:lyrical-latest-deepstream-8.0-amd64 \
          #   ghcr.io/greenroom-robotics/ros_builder:lyrical-latest-deepstream-8.0-arm64

          # docker manifest create ghcr.io/greenroom-robotics/ros_builder:lyrical-${{ needs.release.outputs.version }}-deepstream-8.0 \
          #   ghcr.io/greenroom-robotics/ros_builder:lyrical-${{ needs.release.outputs.version }}-deepstream-8.0-amd64 \
          #   ghcr.io/greenroom-robotics/ros_builder:lyrical-${{ needs.release.outputs.version }}-deepstream-8.0-arm64


          docker manifest push ghcr.io/greenroom-robotics/ros_builder:lyrical-latest
          docker manifest push ghcr.io/greenroom-robotics/ros_builder:lyrical-${{ needs.release.outputs.version }}

          # docker manifest push ghcr.io/greenroom-robotics/ros_builder:lyrical-latest-deepstream-8.0
          # docker manifest push ghcr.io/greenroom-robotics/ros_builder:lyrical-${{ needs.release.outputs.version }}-deepstream-8.0
